<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVGP Summer Camp — Student Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <main class="frame-wrap">
    <section id="register-card" class="ledger-card wide-ledger">
      <header class="masthead">
        <span class="institution-tag">S.V. GOVERNMENT POLYTECHNIC • TIRUPATI</span>
        <h1 class="masthead-title">SVGP Summer Camp</h1>
        <p class="masthead-subtitle">Student Enrollment &amp; Account Registration</p>
      </header>

      <div class="ledger-body">
        <form id="register-form" class="stage-panel" novalidate>
          <div class="panel-head">
            <h2>Create Student Account</h2>
            <p>Complete your profile details to enroll in the training camp</p>
          </div>

          <div class="grid-pair">
            <div class="form-row">
              <label for="reg-fullname">Full Name</label>
              <div class="input-shell">
                <input type="text" id="reg-fullname" placeholder="Enter your full name" required />
                <span class="valid-mark">✓</span>
              </div>
            </div>

            <div class="form-row">
              <label for="reg-username">User ID</label>
              <div class="input-shell">
                <input type="text" id="reg-username" placeholder="e.g. svgp_student01" required />
                <span class="valid-mark">✓</span>
              </div>
            </div>
          </div>

          <div class="grid-pair">
            <div class="form-row">
              <label for="reg-mobile">Mobile No</label>
              <div class="input-shell">
                <input type="tel" id="reg-mobile" maxlength="15" placeholder="10-digit mobile number" required />
                <span class="valid-mark">✓</span>
              </div>
            </div>

            <div class="form-row">
              <label for="reg-email">Gmail ID</label>
              <div class="input-shell">
                <input type="email" id="reg-email" placeholder="student@gmail.com" required />
                <span class="valid-mark">✓</span>
              </div>
            </div>
          </div>

          <div class="grid-pair">
            <div class="form-row">
              <label for="reg-password">Password</label>
              <div class="input-shell">
                <input type="password" id="reg-password" minlength="6" placeholder="Min 6 characters" required />
                <button type="button" class="vis-btn" data-target="reg-password" title="Show/Hide Password">👁</button>
              </div>
            </div>

            <div class="form-row">
              <label for="reg-confirm-password">Confirm Password</label>
              <div class="input-shell">
                <input type="password" id="reg-confirm-password" minlength="6" placeholder="Re-enter password" required />
                <button type="button" class="vis-btn" data-target="reg-confirm-password" title="Show/Hide Password">👁</button>
              </div>
            </div>
          </div>

          <label class="policy-check">
            <input type="checkbox" id="reg-terms" required />
            <span>I agree to the <a href="#terms" onclick="return false;">SVGP Summer Camp Rules &amp; Terms</a></span>
          </label>

          <!-- Image Upload Placed at the End Before Submit Buttons -->
          <div class="upload-row upload-last">
            <img
              id="avatar-preview"
              src="https://api.dicebear.com/9.x/initials/svg?seed=SVGP"
              alt="Profile Preview"
              class="upload-preview"
            />
            <div class="upload-controls">
              <label for="reg-photo" class="upload-label">Upload Profile Photo (Optional)</label>
              <input type="file" id="reg-photo" accept="image/*" class="file-input" />
              <span class="upload-hint">JPG, PNG, or WEBP (Max 1 MB)</span>
            </div>
          </div>

          <div class="cta-group">
            <button type="submit" id="register-submit-btn" class="btn-primary-blue">Create Account</button>
            <a href="index.html" class="btn-soft-blue">Back to Sign In</a>
          </div>

          <div id="register-msg" class="status-text" role="status" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="register.js"></script>
</body>
</html>
